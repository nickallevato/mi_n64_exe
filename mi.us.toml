# N64Recomp config for Mission: Impossible (USA)
[input]
entrypoint = 0x80000400
symbols_file_path = "syms.toml"
rom_file_path = "rom/Mission Impossible (USA).z64"
output_func_path = "RecompiledFuncs"
functions_per_output_file = 50

[patches]
stubs = []
ignored = []

# Busy-wait loops. On hardware, interrupt-driven higher-priority threads preempt these loops; ultramodern
# schedules game threads cooperatively, so each loop must yield while it's still waiting or it deadlocks.
# Each hook runs right before the loop's branch and only yields when the branch is about to loop again.
# scripts/find_spins.py lists candidate loops; all game-side ones are hooked here.

# Wait for the scheduler to bump the retrace counter (beq $v1, $v0 loops while unchanged).
[[patches.hook]]
func = "Sched_WaitForRetrace"
before_vram = 0x8006C32C
text = "{ void yield_self_1ms(uint8_t* rdram); if (ctx->r3 == ctx->r2) yield_self_1ms(rdram); }"

# Wait for the gfx task using the current framebuffer slot to finish (bnez $v0 loops while pending).
[[patches.hook]]
func = "Gfx_BeginFrame"
before_vram = 0x8006C070
text = "{ void yield_self_1ms(uint8_t* rdram); if (ctx->r2 != 0) yield_self_1ms(rdram); }"

# Wait for the gfx tasks of both framebuffer slots to finish (bnez $v0 on each slot's pending flag).
[[patches.hook]]
func = "Gfx_WaitAllTasksDone"
before_vram = 0x8006C2FC
text = "{ void yield_self_1ms(uint8_t* rdram); if (ctx->r2 != 0) yield_self_1ms(rdram); }"

[[patches.hook]]
func = "Gfx_WaitAllTasksDone"
before_vram = 0x8006C30C
text = "{ void yield_self_1ms(uint8_t* rdram); if (ctx->r2 != 0) yield_self_1ms(rdram); }"

# Development stats (MI_STATS=1): count submitted gfx tasks.
[[patches.hook]]
func = "Gfx_SubmitTask"
before_vram = 0x8006C0D8
text = "{ void mi_stats_gfx_submit(void); mi_stats_gfx_submit(); }"
