# N64Recomp config for Mission: Impossible (USA)
[input]
entrypoint = 0x80000400
symbols_file_path = "syms.toml"
rom_file_path = "rom/Mission Impossible (USA).z64"
output_func_path = "RecompiledFuncs"
functions_per_output_file = 50

[patches]
stubs = []
ignored = []

# In-level frame limiter: computes $v1 = last_frame_retrace + 1 and waits until retrace > $v1, i.e. at least
# 2 VIs per frame (30 fps). Replace the +1 with (min VIs per frame - 1) from the app so the cap is configurable.
[[patches.hook]]
func = "Game_LevelLoop"
before_vram = 0x80048170
text = "{ int mi_level_min_vis_per_frame(void); ctx->r3 = ADD32(ctx->r17, mi_level_min_vis_per_frame() - 1); }"

# Data overrides (src/game/overrides.cpp): after an archive entry is decoded ($s2 = entry, $s3 = buffer,
# $v0 = success), MI_OVERRIDE_DIR can replace its contents with an edited file.
[[patches.hook]]
func = "Burp_LoadTo"
before_vram = 0x80068CD4
text = "{ void mi_override_entry(uint8_t*, uint32_t, uint32_t); if (ctx->r2 != 0 && ctx->r18 != 0) mi_override_entry(rdram, (uint32_t)ctx->r18, (uint32_t)ctx->r19); }"

[[patches.hook]]
func = "Burp_Load"
before_vram = 0x80068E64
text = "{ void mi_override_entry(uint8_t*, uint32_t, uint32_t); if (ctx->r2 != 0 && ctx->r18 != 0) mi_override_entry(rdram, (uint32_t)ctx->r18, (uint32_t)ctx->r19); }"

# Debug level warp (src/game/level_warp.cpp): MI_LEVEL=<mission>,<stage> boots straight into a stage. Game_ThreadMain
# calls it after boot init, before the front end loop; it sets up the menus' state and calls Game_RunMission.
[[patches.hook]]
func = "Game_ThreadMain"
before_vram = 0x80048A98
text = "{ void mi_level_warp(uint8_t*, recomp_context*); mi_level_warp(rdram, ctx); }"

# While warping, Game_RunMission skips the mission intro scene ($v0 = play it), the OBJECTIVES/BRIEFING/TEAM menu
# (returns 1 = play) and the objectives screen at the start of the stage (Game_LevelLoop mode bit 2, $a2).
[[patches.hook]]
func = "Game_RunMission"
before_vram = 0x800499CC
text = "{ int mi_level_warp_skip_menus(void); if (mi_level_warp_skip_menus()) ctx->r2 = 0; }"

[[patches.hook]]
func = "Mission_BriefingMenu"
before_vram = 0x80049870
text = "{ int mi_level_warp_skip_menus(void); if (mi_level_warp_skip_menus()) { ctx->r2 = 1; return; } }"

[[patches.hook]]
func = "Game_RunMission"
before_vram = 0x80049AE0
text = "{ int mi_level_warp_skip_menus(void); if (mi_level_warp_skip_menus()) ctx->r6 &= ~(gpr)2; }"

# The warped stage is starting: later stages of the mission play with their normal menus.
[[patches.hook]]
func = "Game_LevelLoop"
before_vram = 0x80047CF8
text = "{ void mi_level_warp_level_started(void); mi_level_warp_level_started(); }"

# Development: MI_DMA_LOG=file logs every Rom_Read(src, dst, size) call (src/main/debug_stats.cpp).
[[patches.hook]]
func = "Rom_Read"
before_vram = 0x80068638
text = "{ void mi_stats_rom_read(uint32_t, uint32_t, uint32_t, uint32_t); mi_stats_rom_read((uint32_t)ctx->r4, (uint32_t)ctx->r5, (uint32_t)ctx->r6, (uint32_t)ctx->r31); }"

# Smooth root motion at 60 fps (src/game/enhancements.cpp): walking moves characters one animation keyframe step at
# a time, and at 60 fps many frames don't reach a new keyframe. At the common exit ($t1 = animation state, $t3 = out
# vector, X/Z already stored), add the partial step for the fraction of a keyframe played.
[[patches.hook]]
func = "Anim_GetRootDelta"
before_vram = 0x80005B7C
text = "{ void mi_root_motion_begin(uint8_t*, uint32_t); mi_root_motion_begin(rdram, (uint32_t)ctx->r4); }"

[[patches.hook]]
func = "Anim_GetRootDelta"
before_vram = 0x80005E64
text = "{ void mi_root_motion_end(uint8_t*, uint32_t, uint32_t); mi_root_motion_end(rdram, (uint32_t)ctx->r9, (uint32_t)ctx->r11); }"

# Audio frame size clamp (src/game/enhancements.cpp): the audio manager's minimum-size check is an unsigned compare
# of a signed frame size, so a negative size passes and later becomes a ~4 GB osAiSetNextBuffer length. $s0 = info.
[[patches.hook]]
func = "Audio_HandleFrame"
before_vram = 0x80072774
text = "{ void mi_audio_clamp_frame_samples(uint8_t*, uint32_t); mi_audio_clamp_frame_samples(rdram, (uint32_t)ctx->r16); }"

# Mouse turning outside aim mode (src/game/mouse.cpp): applied to Ethan's yaw at the start of player control.
[[patches.hook]]
func = "Player_Control"
before_vram = 0x8003EC10
text = "{ void mi_mouse_player_control(uint8_t* rdram); mi_mouse_player_control(rdram); }"

# Sniper mode (Waterloo Station, Mainland): the scope pans only with the stick, which func_80015048 has just read
# into sp+0x10/sp+0x11. Add mouse motion and the right stick there (src/game/mouse.cpp).
[[patches.hook]]
func = "Camera_SniperControl"
before_vram = 0x80015070
text = "{ void mi_mouse_sniper_stick(uint8_t* rdram, uint32_t sp); mi_mouse_sniper_stick(rdram, (uint32_t)ctx->r29); }"

# Mouse aiming (src/game/mouse.cpp). In the aim handler, $f8 holds Ethan's body yaw in radians just before it's
# converted to degrees and stored, and $f22 holds the aim pitch in radians just before it's stored.
[[patches.hook]]
func = "Player_AimControl"
before_vram = 0x8003E384
text = "{ float mi_mouse_take_aim_yaw(void); ctx->f8.fl += mi_mouse_take_aim_yaw(); }"

[[patches.hook]]
func = "Player_AimControl"
before_vram = 0x8003E60C
text = "{ float mi_mouse_apply_aim_pitch(float); ctx->f22.fl = mi_mouse_apply_aim_pitch(ctx->f22.fl); }"

# Busy-wait loops. On hardware, interrupt-driven higher-priority threads preempt these loops; ultramodern
# schedules game threads cooperatively, so each loop must yield while it's still waiting or it deadlocks.
# Each hook runs right before the loop's branch and only yields when the branch is about to loop again.
# scripts/find_spins.py lists candidate loops; all game-side ones are hooked here.

# Wait for the scheduler to bump the retrace counter (beq $v1, $v0 loops while unchanged).
[[patches.hook]]
func = "Sched_WaitForRetrace"
before_vram = 0x8006C32C
text = "{ void yield_self_1ms(uint8_t* rdram); if (ctx->r3 == ctx->r2) yield_self_1ms(rdram); }"

# Wait for the gfx task using the current framebuffer slot to finish (bnez $v0 loops while pending).
[[patches.hook]]
func = "Gfx_BeginFrame"
before_vram = 0x8006C070
text = "{ void yield_self_1ms(uint8_t* rdram); if (ctx->r2 != 0) yield_self_1ms(rdram); }"

# Wait for the gfx tasks of both framebuffer slots to finish (bnez $v0 on each slot's pending flag).
[[patches.hook]]
func = "Gfx_WaitAllTasksDone"
before_vram = 0x8006C2FC
text = "{ void yield_self_1ms(uint8_t* rdram); if (ctx->r2 != 0) yield_self_1ms(rdram); }"

[[patches.hook]]
func = "Gfx_WaitAllTasksDone"
before_vram = 0x8006C30C
text = "{ void yield_self_1ms(uint8_t* rdram); if (ctx->r2 != 0) yield_self_1ms(rdram); }"

# Wait for sound voices to stop (loops while Audio_CountActiveVoices() != 0; the audio thread stops them).
[[patches.hook]]
func = "func_8000D4B4"
before_vram = 0x8000D4E8
text = "{ void yield_self_1ms(uint8_t* rdram); if (ctx->r2 != 0) yield_self_1ms(rdram); }"

[[patches.hook]]
func = "func_8000D50C"
before_vram = 0x8000D540
text = "{ void yield_self_1ms(uint8_t* rdram); if (ctx->r2 != 0) yield_self_1ms(rdram); }"

[[patches.hook]]
func = "func_8000D5B0"
before_vram = 0x8000D608
text = "{ void yield_self_1ms(uint8_t* rdram); if (ctx->r2 != 0) yield_self_1ms(rdram); }"

[[patches.hook]]
func = "func_8000D5B0"
before_vram = 0x8000D66C
text = "{ void yield_self_1ms(uint8_t* rdram); if (ctx->r2 != 0) yield_self_1ms(rdram); }"

[[patches.hook]]
func = "func_8000D798"
before_vram = 0x8000D7E8
text = "{ void yield_self_1ms(uint8_t* rdram); if (ctx->r2 != 0) yield_self_1ms(rdram); }"

# Wait until A/B/Start are released (loops while Input_GetButtons() & 0xD000; the controller thread updates it).
[[patches.hook]]
func = "func_800463CC"
before_vram = 0x80046640
text = "{ void yield_self_1ms(uint8_t* rdram); if (ctx->r2 != 0) yield_self_1ms(rdram); }"

# Wait until an ID ($s1) leaves an active-ID table (rescans while found).
[[patches.hook]]
func = "func_8005A2A4"
before_vram = 0x8005A304
text = "{ void yield_self_1ms(uint8_t* rdram); if (ctx->r17 == ctx->r2) yield_self_1ms(rdram); }"

# Development stats (MI_STATS=1): count submitted gfx tasks.
[[patches.hook]]
func = "Gfx_SubmitTask"
before_vram = 0x8006C0D8
text = "{ void mi_stats_gfx_submit(void); mi_stats_gfx_submit(); }"
